name: release

# A release starts with an annotated tag vX.Y.Z pushed on the merge commit of
# the version bump on main. This workflow then tests that commit, publishes
# the crates to crates.io and creates the GitHub release with the changelog of
# that version. It can also be started by hand for a tag that already exists;
# crates and releases that are already published are left as they are.
#
# It needs the repository secret CARGO_REGISTRY_TOKEN, a crates.io token that
# may publish new versions of the five classeq crates.
#
# Tags of the ready-made databases (db-<name>-v<N>, databases) do not match
# the pattern and do not start it.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.12.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag is the workspace version and is on main
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  crates:
    name: publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          version=${TAG#v}
          for crate in classeq-core classeq-ports-lib classeq-cli classeq-api classeq-watcher; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "classeq2-release-workflow" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

  github:
    name: create the GitHub release
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create the release with the changelog of this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v tag="$TAG" '
            /^## / { on = ($2 == tag) }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
